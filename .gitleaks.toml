[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation examples"
paths = [
  '''services/evals/baseline/tests/.*''',
  '''services/backend/src/test/.*''',
  '''apps/windows/sidecar/src/test/.*''',
  '''scripts/test_plan_status\.py''',
  '''docs/.*''',
  '''README\.md''',
  '''CHANGELOG\.md''',
  '''services/evals/bench/tasks/.*''',
  # Ed25519 test vectors: public keys and signatures derived from fixed,
  # published seeds by tools/scripts/build-approval-signature-fixtures.py.
  '''spec/fixtures/approval-signatures\.json'''
]
regexes = [
  '''harmony-clt-[0-9A-Za-z.\-]+''',
  '''key: gitleaks-v[0-9.]+'''
]
